<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='tenantsinfo.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='edit.css') }}">
  <title>Edit Tenant</title>
</head>

<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>{{ website_name }}</h1>
  </div>
  <br>

    <a href="{{ url_for('dash_page') }}">
      <i class="fa fa-dashboard"></i> Dashboard
    </a><br>

    <div class="dropdown">
      <a href="#" class="dropbtn"><i class="fa fa-fw fa-user"></i> Tenants ▾</a>
      <div class="dropdown-content">
        <a href="{{ url_for('add_tenants') }}">➕ Add Tenant</a>
        <a href="{{ url_for('save_tenants') }}">📋 Tenants Info</a>
      </div>
    </div><br>

    <a href="{{ url_for('room_page') }}">
      <i class="fa fa-hotel"></i> Rooms
    </a><br>

    <a href="{{ url_for('payment_page') }}">
      <i class="fa fa-credit-card"></i> Payment
    </a><br>

    <a href="{{ url_for('about_page') }}">
      <i class="fa fa-info-circle"></i> About
    </a><br>
  </div>
<div class="main">
    <header>
        <h2>Edit Tenant Info</h2>
      </header>
            <div class="form-container">
                <form method="POST" action="{{ url_for('edit_tenant', tenant_id=tenant['tenant_id']) }}">
                  <h3>Tenant Information</h3>
            
                  <input type="text" name="fullname" value="{{ tenant.fullname }}" required>
                  <input type="number" name="age" value="{{ tenant.age }}" required>
                  <input type="text" name="gender" value="{{ tenant.gender }}" required>
                  <input type="text" name="address" value="{{ tenant.address }}" required>
                  <input type="text" name="contact_no" value="{{ tenant.contact_no }}" required>
                  <input type="text" name="room_number" value="{{ tenant.room_number }}" required>
                  <input type="number" step="0.01" name="room_price" value="{{ tenant.room_price }}" required>
                  <input type="date" name="date_occupied" value="{{ tenant.date_occupied|safe }}" required>

            
                  <button type="submit">Update</button>
                </form>
              </div>
      </div>
      
</div>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
  const socket = io("http://127.0.0.1:5000", {
    transports: ["websocket"]
  });

  socket.on("sensor_update", data => {
    let popup = document.getElementById("fireOverlay");
    console.log("Received:", data);

    // Show overlay when fire detected
    if (data.status === "FIRE") {
      window.location.href="{{url_for('alert')}}";
    }
  });
</script>
</body>
</html>
